[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evotrace"
version = "0.1.0"
description = "Reproducible evolutionary sequence analysis with explicit scientific limits"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "EvoTrace contributors"}]
dependencies = ["biopython>=1.80", "numpy>=1.23", "PyYAML>=6.0"]

[project.optional-dependencies]
web = ["streamlit>=1.30", "plotly>=5.18", "pandas>=1.5"]
dev = ["pytest>=7.4", "ruff>=0.3", "mypy>=1.8", "build>=1.0", "types-PyYAML>=6.0"]
all = ["streamlit>=1.30", "plotly>=5.18", "pandas>=1.5", "pytest>=7.4", "ruff>=0.3", "mypy>=1.8"]

[project.scripts]
evotrace = "evotrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
